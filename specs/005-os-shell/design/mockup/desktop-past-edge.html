<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV – Alex Profir</title>
<link rel="stylesheet" href="fonts.css">

<body class="wallpaper">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="icon-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="icon-top"/><stop offset="1" class="icon-bottom"/></linearGradient></defs>
  <symbol id="i-min" viewBox="0 0 16 16"><path d="M4 8h8"/></symbol>
  <symbol id="i-max" viewBox="0 0 16 16"><path d="M6.5 3h6.5v6.5z M9.5 13H3V6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-restore" viewBox="0 0 16 16"><path d="M9 2.5V7h4.5z M7 13.5V9H2.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></symbol>
  <symbol id="i-home" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></symbol>
  <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/><path d="M10 9v5M10 6v.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 10 10"><path d="M1 5h8M5.5 1.5L9 5l-3.5 3.5"/></symbol>
  <symbol id="i-grip" viewBox="0 0 12 12"><path d="M11 4l-7 7M11 8l-3 3"/></symbol>
  <symbol id="i-out" viewBox="0 0 10 10"><path d="M2 8l6-6M3 2h5v5"/></symbol>
</svg>
<nav class="menu-bar" aria-label="Menu bar"><div class="menu-slot"><button class="menu-title" aria-label="Site menu" aria-haspopup="menu" aria-expanded="false"><svg class="site-mark" viewBox="0 0 16 16" aria-hidden="true"><rect class="shadow" x="4" y="4" width="11" height="11"/><rect class="face" x="1" y="1" width="11" height="11"/></svg></button></div><div class="menu-slot"><button class="menu-title is-app" aria-haspopup="menu" aria-expanded="false">CV</button></div><div class="menu-slot"><button class="menu-title" aria-haspopup="menu" aria-expanded="false">Window</button></div></nav>
<section class="window is-focused at-cv past-edge" aria-label="CV">
  <header class="title-bar"><div class="controls">
      <button class="control close" aria-label="Close CV"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
      <button class="control min" aria-label="Minimize CV"><svg aria-hidden="true"><use href="#i-min"/></svg></button>
      <button class="control max" aria-label="Maximize CV"><svg aria-hidden="true"><use href="#i-max"/></svg></button>
    </div><span class="title">CV</span></header>
  <div class="window-body">
    <div class="app-bar"><a href="/cv">Open as a page to print or share <svg class="arrow" aria-hidden="true"><use href="#i-arrow"/></svg></a></div>
    <iframe class="cv-frame" src="http://127.0.0.1:4173/cv" title="CV"></iframe>
    
  </div>
  <svg class="grip" aria-hidden="true"><use href="#i-grip"/></svg>
</section>
<nav class="dock" aria-label="Dock"><button class="dock-item is-open" aria-label="CV, open"><svg class="app-icon" viewBox="0 0 64 64" aria-hidden="true">
  <rect class="tile" width="64" height="64"/>
  <path class="line" d="M19 16v32"/>
  <circle class="ink" cx="19" cy="18" r="4.5"/><circle class="ink" cx="19" cy="32" r="4.5"/><circle class="ink" cx="19" cy="46" r="4.5"/>
  <rect class="ink" x="29" y="15" width="20" height="3"/><rect class="faint" x="29" y="20" width="13" height="3"/>
  <rect class="ink" x="29" y="29" width="16" height="3"/><rect class="faint" x="29" y="34" width="11" height="3"/>
  <rect class="ink" x="29" y="43" width="18" height="3"/><rect class="faint" x="29" y="48" width="9" height="3"/>
</svg><span>CV</span><span class="open-mark"></span></button></nav>
</body>
</html>
